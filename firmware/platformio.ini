; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Each program lives in its own folder next to this file and has an environment
; of the same name below. Upload one with, for example:
;   pio run -e led_test -t upload
[platformio]
src_dir = .
default_envs = simple_animation

; Settings shared by every program
[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200

; the board will likely be either an arduino uno or diecimila. The board
; name below should be as follows:
; - Arduino Uno: uno
; - Arduino Diecimila 168: diecimilaatmega168
; - Arduino Diecimila 328: diecimilaatmega328
board = diecimilaatmega168

; Uncomment to pin a specific upload/monitor port
; upload_port = COM3
; monitor_port = COM3

; WS2812 test: cycles colours, a chase and a rainbow on 12 LEDs (led_test/main.cpp)
[env:led_test]
build_src_filter = -<*> +<led_test/>
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0

; Serial test: parses the 7-band frames from audio_stream.py and echoes them back (serial_test/main.cpp)
[env:serial_test]
build_src_filter = -<*> +<serial_test/>

; Three audio animations on 12 WS2812 LEDs: VU meter, shooting lights, beat ripples (animations/)
[env:animations]
build_src_filter = -<*> +<animations/>
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0

; Drives 12 WS2812 LEDs from the 7-band frames, one zone per band (simple_animation/main.cpp)
[env:simple_animation]
build_src_filter = -<*> +<simple_animation/>
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
